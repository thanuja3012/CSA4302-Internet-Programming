<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Ticket - Bus Ticket Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-bus-front-fill"></i> Bus Ticket Booking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="buses.html">Search Buses</a></li>
          <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5" id="bookingPage">
    <div id="bookingMessage"></div>
    <div id="busInfo"></div>
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card card-shadow p-4 mb-4">
          <h5 class="mb-4">Seat Selection</h5>
          <div class="seat-status mb-4">
            <span class="status-pill available"><span></span> Available</span>
            <span class="status-pill selected"><span></span> Selected</span>
            <span class="status-pill booked"><span></span> Booked</span>
          </div>
          <div id="seatMapContainer" class="seat-map"></div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card card-shadow p-4 mb-4">
          <h5 class="mb-3">Selection Details</h5>
          <p class="mb-1"><strong>Seats:</strong> <span id="selectedSeats">None</span></p>
          <div id="seatSummary"></div>
        </div>
        <div id="passengerFormSection" class="d-none">
          <div class="card card-shadow p-4 mb-4">
            <h5 class="mb-3">Passenger Details</h5>
            <div id="passengerFormsContainer"></div>
          </div>
        </div>
        <div id="bookingSummary"></div>
        <div class="d-grid">
          <button id="completeBookingButton" class="btn btn-primary btn-lg">Proceed to Payment</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="sticky-footer py-4">
    <div class="container text-center text-white">
      <p class="mb-0">Select your seats and complete passenger details to continue to payment.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
