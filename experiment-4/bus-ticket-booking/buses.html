<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search Buses - Bus Ticket Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-bus-front-fill"></i> Bus Ticket Booking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="buses.html">Search Buses</a></li>
          <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5" id="busesPage">
    <div class="row mb-4">
      <div class="col-lg-8">
        <h2 class="section-title">Search Available Buses</h2>
        <p class="text-muted">Use the form to filter buses by route and journey date.</p>
      </div>
    </div>
    <div class="card card-shadow p-4 mb-5">
      <form id="busSearchForm" class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Source</label>
          <input type="text" id="searchSource" class="form-control" placeholder="Chennai">
        </div>
        <div class="col-md-3">
          <label class="form-label">Destination</label>
          <input type="text" id="searchDestination" class="form-control" placeholder="Bangalore">
        </div>
        <div class="col-md-3">
          <label class="form-label">Date</label>
          <input type="date" id="searchDate" class="form-control">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" type="submit"><i class="bi bi-search"></i> Search Buses</button>
        </div>
      </form>
    </div>
    <div class="row" id="busList"></div>
  </main>

  <footer class="sticky-footer py-4">
    <div class="container text-center text-white">
      <p class="mb-0">Search buses based on source, destination, and date. Results update instantly.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/buses.js"></script>
</body>
</html>
