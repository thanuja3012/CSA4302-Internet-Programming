<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus Categories - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="d-flex">
    <aside class="admin-sidebar p-3 d-none d-lg-block" style="width:260px;">
      <div class="text-white mb-4">
        <h4 class="fw-bold">Admin Panel</h4>
      </div>
      <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="manage-buses.html"><i class="bi bi-bus-front-fill me-2"></i>Manage Buses</a>
        <a class="nav-link active" href="categories.html"><i class="bi bi-tags-fill me-2"></i>Bus Categories</a>
        <a class="nav-link" href="manage-users.html"><i class="bi bi-people-fill me-2"></i>Manage Users</a>
        <a class="nav-link" href="manage-bookings.html"><i class="bi bi-card-checklist me-2"></i>Manage Bookings</a>
        <a class="nav-link" href="reports.html"><i class="bi bi-bar-chart-fill me-2"></i>Reports</a>
        <a class="nav-link" href="admin-login.html" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
      </nav>
    </aside>
    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="section-title mb-1">Manage Bus Categories</h2>
          <p class="text-muted">Add or update bus categories for route search filters.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#categoryModal">Add Category</button>
      </div>
      <div id="categoryMessage"></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Category</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categoryTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="categoryModalLabel">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="categoryForm" novalidate>
            <input type="hidden" id="categoryId">
            <div class="mb-3">
              <label class="form-label">Category Name</label>
              <input type="text" id="categoryName" class="form-control" required>
            </div>
            <div class="text-end">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Category</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
