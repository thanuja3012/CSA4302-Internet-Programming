<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Bus Ticket Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-bus-front-fill"></i> Bus Ticket Booking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-login.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card card-shadow p-4">
          <div class="card-body">
            <h2 class="card-title mb-3">Login</h2>
            <p class="text-muted">Demo authentication that stores registered users in localStorage.</p>
            <div id="loginMessage"></div>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Email / Username</label>
                <input type="text" id="loginEmail" class="form-control" placeholder="example@mail.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="rememberMe">
                  <label class="form-check-label" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="text-decoration-none">Forgot Password?</a>
              </div>
              <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>
            <p class="mt-4 text-center">Don't have an account? <a href="register.html">Create Account</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="sticky-footer py-4">
    <div class="container text-center text-white">
      <p class="mb-0">Use demo credentials or register a new user to try the booking flow.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
