<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Buses - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="d-flex">
    <aside class="admin-sidebar p-3 d-none d-lg-block" style="width:260px;">
      <div class="text-white mb-4">
        <h4 class="fw-bold">Admin Panel</h4>
      </div>
      <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link active" href="manage-buses.html"><i class="bi bi-bus-front-fill me-2"></i>Manage Buses</a>
        <a class="nav-link" href="categories.html"><i class="bi bi-tags-fill me-2"></i>Bus Categories</a>
        <a class="nav-link" href="manage-users.html"><i class="bi bi-people-fill me-2"></i>Manage Users</a>
        <a class="nav-link" href="manage-bookings.html"><i class="bi bi-card-checklist me-2"></i>Manage Bookings</a>
        <a class="nav-link" href="reports.html"><i class="bi bi-bar-chart-fill me-2"></i>Reports</a>
        <a class="nav-link" href="admin-login.html" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
      </nav>
    </aside>
    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="section-title mb-1">Manage Buses</h2>
          <p class="text-muted">Add, edit, or delete bus routes and fares.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#busModal">Add Bus</button>
      </div>
      <div id="adminBusMessage"></div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Bus Name</th>
              <th>Number</th>
              <th>Category</th>
              <th>Route</th>
              <th>Date</th>
              <th>Price</th>
              <th>Seats</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="busTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal fade" id="busModal" tabindex="-1" aria-labelledby="busModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="busModalLabel">Add/Edit Bus</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="busForm" novalidate>
            <input type="hidden" id="busId">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Bus Name</label>
                <input type="text" id="busName" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Bus Number</label>
                <input type="text" id="busNumber" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select id="busCategory" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Route (Source → Destination)</label>
                <div class="row g-2">
                  <div class="col-6"><input type="text" id="busSource" class="form-control" placeholder="Source" required></div>
                  <div class="col-6"><input type="text" id="busDestination" class="form-control" placeholder="Destination" required></div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Departure Time</label>
                <input type="text" id="busDepartureTime" class="form-control" placeholder="08:00 AM" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Arrival Time</label>
                <input type="text" id="busArrivalTime" class="form-control" placeholder="02:30 PM" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Journey Date</label>
                <input type="date" id="busDate" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Price</label>
                <input type="number" id="busPrice" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Total Seats</label>
                <input type="number" id="busSeats" class="form-control" required>
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea id="busDescription" class="form-control" rows="3"></textarea>
              </div>
            </div>
            <div class="mt-4 text-end">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Bus</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
