<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment - Bus Ticket Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-bus-front-fill"></i> Bus Ticket Booking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="buses.html">Search Buses</a></li>
          <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5" id="paymentPage">
    <div class="row g-4">
      <div class="col-lg-5" id="paymentSummary"></div>
      <div class="col-lg-7">
        <div class="card card-shadow p-4">
          <h5 class="mb-4">Secure Payment Demo</h5>
          <div id="paymentMessage"></div>
          <form id="paymentForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <div class="d-flex gap-2 flex-wrap">
                <label class="btn btn-outline-primary active">
                  <input type="radio" name="paymentMethod" value="Credit Card" checked class="d-none"> Credit Card
                </label>
                <label class="btn btn-outline-primary">
                  <input type="radio" name="paymentMethod" value="Debit Card" class="d-none"> Debit Card
                </label>
                <label class="btn btn-outline-primary">
                  <input type="radio" name="paymentMethod" value="UPI" class="d-none"> UPI
                </label>
                <label class="btn btn-outline-primary">
                  <input type="radio" name="paymentMethod" value="Net Banking" class="d-none"> Net Banking
                </label>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Card Number</label>
                <input type="text" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" maxlength="16" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Card Holder Name</label>
                <input type="text" id="cardHolder" class="form-control" placeholder="Full Name" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Expiry Date</label>
                <input type="month" id="expiryDate" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">CVV</label>
                <input type="password" id="cvv" class="form-control" placeholder="123" maxlength="4" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">UPI ID</label>
                <input type="text" id="upiId" class="form-control" placeholder="example@bank">
              </div>
            </div>
            <div class="mt-4 d-grid">
              <button type="submit" class="btn btn-primary btn-lg">Pay Now</button>
            </div>
          </form>
          <p class="mt-3 text-muted small">This is a frontend demo only. No real payment is processed.</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="sticky-footer py-4">
    <div class="container text-center text-white">
      <p class="mb-0">Cards and payment details are validated for presentation purposes only.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/payment.js"></script>
</body>
</html>
