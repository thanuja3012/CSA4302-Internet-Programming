<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Bus Ticket Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-bus-front-fill"></i> Bus Ticket Booking</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="admin-login.html">Admin</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card card-shadow p-4">
          <div class="card-body">
            <h2 class="card-title mb-3">Create Your Account</h2>
            <p class="text-muted">Register with valid details. This is a demo site using localStorage for user management.</p>
            <div id="registerMessage"></div>
            <form id="registerForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" id="fullName" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label>
                  <input type="email" id="email" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Mobile Number</label>
                  <input type="tel" id="mobile" class="form-control" required pattern="[0-9]{10}">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" id="dob" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Password</label>
                  <input type="password" id="password" class="form-control" required minlength="6">
                </div>
                <div class="col-md-6">
                  <label class="form-label">Confirm Password</label>
                  <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                </div>
                <div class="col-12">
                  <label class="form-label">Address</label>
                  <textarea id="address" class="form-control" rows="3" required></textarea>
                </div>
              </div>
              <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary">Register</button>
                <button type="reset" class="btn btn-outline-secondary">Reset</button>
              </div>
            </form>
            <p class="mt-4 text-center">Already registered? <a href="login.html">Login here</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="sticky-footer py-4">
    <div class="container text-center text-white">
      <p class="mb-0">This demo stores user data locally. Real applications require secure backend authentication.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
