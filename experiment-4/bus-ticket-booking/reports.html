<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="d-flex">
    <aside class="admin-sidebar p-3 d-none d-lg-block" style="width:260px;">
      <div class="text-white mb-4">
        <h4 class="fw-bold">Admin Panel</h4>
      </div>
      <nav class="nav flex-column gap-2">
        <a class="nav-link" href="admin-dashboard.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
        <a class="nav-link" href="manage-buses.html"><i class="bi bi-bus-front-fill me-2"></i>Manage Buses</a>
        <a class="nav-link" href="categories.html"><i class="bi bi-tags-fill me-2"></i>Bus Categories</a>
        <a class="nav-link" href="manage-users.html"><i class="bi bi-people-fill me-2"></i>Manage Users</a>
        <a class="nav-link" href="manage-bookings.html"><i class="bi bi-card-checklist me-2"></i>Manage Bookings</a>
        <a class="nav-link active" href="reports.html"><i class="bi bi-bar-chart-fill me-2"></i>Reports</a>
        <a class="nav-link" href="admin-login.html" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
      </nav>
    </aside>
    <main class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="section-title mb-1">Reports</h2>
          <p class="text-muted">Generate booking and revenue reports for analysis.</p>
        </div>
      </div>
      <div class="row g-4 mb-4">
        <div class="col-md-3">
          <div class="card admin-card p-4 text-center">
            <h3 id="reportTotalBookings">0</h3>
            <p class="mb-0 text-muted">Total Bookings</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card admin-card p-4 text-center">
            <h3 id="reportCancelledBookings">0</h3>
            <p class="mb-0 text-muted">Cancelled</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card admin-card p-4 text-center">
            <h3 id="reportRevenue">₹0.00</h3>
            <p class="mb-0 text-muted">Revenue</p>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card admin-card p-4 text-center">
            <h3 id="reportUsers">0</h3>
            <p class="mb-0 text-muted">Registered Users</p>
          </div>
        </div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-4"><input type="date" id="reportDate" class="form-control" placeholder="Filter Date"></div>
        <div class="col-md-4"><select id="reportBus" class="form-select"><option value="">All Buses</option></select></div>
        <div class="col-md-4 d-grid"><button id="generateReportBtn" class="btn btn-primary">Generate Report</button></div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>Booking ID</th>
              <th>User</th>
              <th>Bus</th>
              <th>Date</th>
              <th>Seats</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="reportTableBody"></tbody>
        </table>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-outline-secondary" id="printReportBtn">Print Report</button>
        <button class="btn btn-success" id="downloadReportBtn">Download CSV</button>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
