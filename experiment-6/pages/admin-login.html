<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administrator Login | SkyLink Airlines</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container page-shell">
      <a class="brand" href="../index.html">← Back to Home</a>
      <section class="panel">
        <h1>Administrator User Login</h1>
        <p>Secure access for airline administrators to manage schedules, inventory, and accounts.</p>
        <form>
          <div class="form-grid">
            <label>
              Admin ID
              <input type="text" placeholder="ADM-1024" required />
            </label>
            <label>
              Password
              <input type="password" placeholder="Enter password" required />
            </label>
          </div>
          <div class="inline-row" style="margin-top: 1rem;">
            <button type="submit">Login</button>
            <a class="btn btn-secondary" href="forgot-password.html" style="color: white;">Forgot Password</a>
          </div>
        </form>
      </section>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
