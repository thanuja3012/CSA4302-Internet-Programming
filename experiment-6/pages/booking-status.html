<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Status | SkyLink Airlines</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container page-shell">
      <a class="brand" href="../index.html">← Back to Home</a>
      <section class="panel">
        <h1>View Booking Status</h1>
        <p>Track the current status of your booking and confirmations.</p>
        <form>
          <label>
            Booking Reference
            <input type="text" placeholder="SL-20260808-1042" required />
          </label>
          <div class="inline-row" style="margin-top: 1rem;">
            <button type="submit">Check Status</button>
            <a class="btn btn-secondary" href="print-ticket.html" style="color: white;">Print Ticket</a>
          </div>
        </form>
      </section>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
