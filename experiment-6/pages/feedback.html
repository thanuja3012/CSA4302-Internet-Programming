<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Feedback | SkyLink Airlines</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container page-shell">
      <a class="brand" href="../index.html">← Back to Home</a>
      <section class="panel">
        <h1>Customer Feedback</h1>
        <p>Share your experience and help improve the airline reservation service.</p>
        <form>
          <div class="form-grid">
            <label>
              Full Name
              <input type="text" placeholder="Your name" required />
            </label>
            <label>
              Email
              <input type="email" placeholder="you@example.com" required />
            </label>
          </div>
          <label style="margin-top: 1rem;">
            Feedback
            <textarea rows="5" placeholder="Tell us about your experience..."></textarea>
          </label>
          <div class="inline-row" style="margin-top: 1rem;">
            <button type="submit">Submit Feedback</button>
          </div>
        </form>
      </section>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
