<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | SkyLink Airlines</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container page-shell">
      <a class="brand" href="../index.html">← Back to Home</a>
      <section class="panel">
        <h1>Forgot Password</h1>
        <p>Enter your registered email address to receive a password reset link.</p>
        <form>
          <label>
            Email Address
            <input type="email" placeholder="traveler@example.com" required />
          </label>
          <div class="inline-row" style="margin-top: 1rem;">
            <button type="submit">Send Reset Link</button>
            <a class="btn btn-secondary" href="admin-login.html" style="color: white;">Back to Login</a>
          </div>
        </form>
      </section>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
