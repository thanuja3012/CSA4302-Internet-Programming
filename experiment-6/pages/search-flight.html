<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Flight | SkyLink Airlines</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="container page-shell">
      <a class="brand" href="../index.html">← Back to Home</a>
      <section class="panel">
        <h1>Search Flight</h1>
        <p>Find available flights by destination, travel date, and cabin class.</p>
        <form>
          <div class="form-grid">
            <label>
              From
              <input type="text" value="Delhi" required />
            </label>
            <label>
              To
              <input type="text" value="Mumbai" required />
            </label>
            <label>
              Departure Date
              <input type="date" required />
            </label>
            <label>
              Travel Class
              <select>
                <option>Economy</option>
                <option>Business</option>
                <option>First</option>
              </select>
            </label>
          </div>
          <div class="inline-row" style="margin-top: 1rem;">
            <button type="submit">Search Flights</button>
          </div>
        </form>

        <div class="notice" style="margin-top: 1rem;">
          Available flights shown below with live seat inventory and fare details.
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>Flight</th>
              <th>Departure</th>
              <th>Arrival</th>
              <th>Seats Left</th>
              <th>Fare</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>SL 401</td>
              <td>08:30</td>
              <td>10:45</td>
              <td>12</td>
              <td>$145</td>
            </tr>
            <tr>
              <td>SL 512</td>
              <td>14:20</td>
              <td>16:35</td>
              <td>5</td>
              <td>$189</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
    <script src="../script.js"></script>
  </body>
</html>
